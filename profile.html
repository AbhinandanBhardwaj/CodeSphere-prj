<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CODESPHERE - Profile</title>


    <link
        rel="stylesheet"
        href="css/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/profile.css"
    >

    <link rel="stylesheet" href="css/navigation.css">
</head>


<body>


<div class="app-container">


    <!-- ======================================
         SIDEBAR
         ====================================== -->

    <aside class="sidebar" aria-label="CodeSphere navigation">
    <!-- Shared navigation is rendered by js/sidebar.js -->
</aside>


    <!-- ======================================
         MAIN
         ====================================== -->

    <main class="main-content profile-page">


        <!-- PROFILE HEADER -->

        <section class="profile-header">


            <div class="large-avatar">

                D

            </div>


            <div>

                <div class="sys-tag">
                    DEVELOPER PROFILE
                </div>

                <h2>
                    DevCoder
                </h2>

                <span class="profile-online">
                    ● ONLINE
                </span>

            </div>


        </section>


        <!-- PROFILE NAVIGATION -->

        <div class="profile-tabs">


            <a
                href="profile.html"
                class="profile-tab active"
            >
                Overview
            </a>


            <a
                href="#progress"
                class="profile-tab"
            >
                Progress
            </a>


            <a
                href="#solved"
                class="profile-tab"
            >
                Solved Problems
            </a>


        </div>


        <!-- ==================================
             PROGRESS
             ================================== -->

        <section
            id="progress"
            class="progress-section"
        >


            <div class="section-heading">

                <div>

                    <div class="sys-tag">
                        PERFORMANCE
                    </div>

                    <h3>
                        PROGRESS
                    </h3>

                </div>

            </div>


            <!-- STATS -->

            <div class="progress-stats">


                <div class="progress-stat">

                    <span
                        id="profile-solved"
                        class="progress-number"
                    >
                        0
                    </span>

                    <span class="progress-label">
                        QUESTIONS SOLVED
                    </span>

                </div>


                <div class="progress-stat">

                    <span
                        id="profile-streak"
                        class="progress-number"
                    >
                        0
                    </span>

                    <span class="progress-label">
                        CURRENT STREAK
                    </span>

                </div>


                <div class="progress-stat">

                    <span
                        id="profile-best"
                        class="progress-number"
                    >
                        0
                    </span>

                    <span class="progress-label">
                        BEST STREAK
                    </span>

                </div>


            </div>


            <!-- ==================================
                 CONTRIBUTION CALENDAR
                 ================================== -->

            <div class="progress-card">


                <div class="progress-card-header">


                    <div>

                        <div class="sys-tag">
                            ACTIVITY
                        </div>

                        <h3>
                            CONTRIBUTIONS
                        </h3>

                    </div>


                    <span
                        id="contribution-total"
                        class="contribution-total"
                    >
                        0 contributions
                    </span>


                </div>


                <div
                    id="calendar-container"
                    class="calendar-container"
                ></div>


                <div class="calendar-legend">


                    <span>
                        Less
                    </span>


                    <span class="legend-cell level-0"></span>

                    <span class="legend-cell level-1"></span>

                    <span class="legend-cell level-2"></span>

                    <span class="legend-cell level-3"></span>

                    <span class="legend-cell level-4"></span>


                    <span>
                        More
                    </span>


                </div>


            </div>


            <!-- ==================================
                 RECENT ACTIVITY
                 ================================== -->

            <div class="progress-card">


                <div class="progress-card-header">

                    <div>

                        <div class="sys-tag">
                            HISTORY
                        </div>

                        <h3>
                            RECENT ACTIVITY
                        </h3>

                    </div>

                </div>


                <div
                    id="recent-activity"
                    class="recent-activity"
                ></div>


            </div>


        </section>


    </main>


</div>


<script src="js/data.js"></script>

<script src="js/profile.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
